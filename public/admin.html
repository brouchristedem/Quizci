<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Quizci · Admin</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .top .logo{font-size:1.7rem}

  /* Statistiques : grille régulière, cartes de même hauteur */
  .stats{grid-template-columns:repeat(2,1fr);grid-auto-rows:1fr;margin:14px 0 6px}
  .stat{display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:96px}
  .stat span{font-size:.85rem;line-height:1.25}
  .stat b{font-size:1.9rem;line-height:1}
  @media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}

  /* Liste de quiz : une carte par quiz */
  .qlist{display:grid;gap:12px;margin-top:8px}
  @media (min-width:760px){.qlist{grid-template-columns:1fr 1fr}}
  .qa{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
  .qa-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .qa-title{font-weight:800;font-size:1.05rem;line-height:1.25;overflow-wrap:anywhere}
  .qa-meta{color:var(--mut);font-size:.88rem}
  .qa-meta code{background:rgba(255,255,255,.12);border-radius:6px;padding:1px 6px;color:#fff}
  .qa-who{display:flex;flex-direction:column;font-size:.92rem;overflow-wrap:anywhere}
  .qa-who span{color:var(--mut);font-size:.85rem}
  .qa-pin{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;font-size:.85rem;color:var(--mut)}
  .qa-pin b{font-size:1.5rem;letter-spacing:.12em;color:#fff}
  .qa-actions{display:flex;gap:8px;margin-top:4px}
  .qa-actions button{white-space:nowrap;min-height:46px}
  .qa-actions .act{flex:1 1 auto}
  .qa-actions .del{flex:0 0 auto;background:transparent;border:2px solid var(--ko);color:#ffd0da}
  .empty{text-align:center;padding:28px 12px}
  .qa-actions .sec{flex:1 1 auto;background:rgba(255,255,255,.1);border:2px solid var(--line);color:#fff}
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .ov .box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;width:100%;max-width:480px;max-height:86vh;overflow:auto}
  .rk{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line)}
  .rk .n{flex:0 0 2.2rem;font-weight:800;color:var(--mut);text-align:center}
  .rk:nth-child(-n+3) .n{color:#fff}
  .rk .p{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
  .rk .s{font-weight:800;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap wide">
  <div class="top"><div class="logo">Quiz<b>ci</b> · Admin</div><button id="out" class="out hide" type="button">Déconnexion</button></div>

  <div id="login" class="card center">
    <p>Connexion réservée à l'administrateur.</p>
    <button id="gbtn" type="button">Se connecter avec Google</button>
    <div id="lerr" class="err hide"></div>
  </div>

  <div id="app" class="hide">
    <div class="stats" id="stats"></div>
    <h2>Quiz</h2>
    <div id="list" class="qlist"><p class="muted empty">Chargement…</p></div>
  </div>
</div>

<script type="module">
import { auth, db, $, esc, ADMIN_EMAIL, PRIX,
  GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged,
  collection, query, where, getDocs, updateDoc, deleteDoc, writeBatch, doc, onSnapshot, serverTimestamp, deleteField } from "./js/fb.js";

const LABEL = { brouillon: "À activer", actif: "Actif", en_cours: "En cours", termine: "Terminé" };
const RANK = { brouillon: 0, actif: 1, en_cours: 1, termine: 2 };
let ALL = [];

const err = (m) => { const e = $("#lerr"); e.textContent = m; e.classList.remove("hide"); };
$("#gbtn").onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => err(e.message));
$("#out").onclick = () => signOut(auth);

let unsub = null;
onAuthStateChanged(auth, (u) => {
  if (unsub) { unsub(); unsub = null; }
  const ok = !!(u && !u.isAnonymous && u.email === ADMIN_EMAIL);
  $("#login").classList.toggle("hide", ok);
  $("#app").classList.toggle("hide", !ok);
  // Un joueur est connecté en anonyme sur ce site : pas de bouton Déconnexion ni d'erreur pour lui
  $("#out").classList.toggle("hide", !u || u.isAnonymous);
  $("#lerr").classList.add("hide");
  if (u && !u.isAnonymous && !ok) { err("Ce compte n'est pas administrateur."); return; }
  if (ok) unsub = onSnapshot(collection(db, "quizzes"),
    (s) => { ALL = s.docs.map((d) => ({ id: d.id, ...d.data() })); draw(); },
    (e) => { $("#list").innerHTML = `<p class="err">${esc(e.message)}</p>`; });
});

const fmt = (t) => t?.toDate ? t.toDate().toLocaleString("fr-FR", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";

function card(q) {
  const live = q.statut === "actif" || q.statut === "en_cours";
  const pin = live && q.pin ? `<div class="qa-pin">PIN <b>${esc(q.pin)}</b></div>` : "";
  let actions = "";
  if (q.statut === "brouillon") {
    actions = `<div class="qa-actions"><button class="ok act" type="button" data-act="on" data-id="${esc(q.id)}">Rendre actif</button><button class="del" type="button" data-act="del" data-id="${esc(q.id)}">Supprimer</button></div>`;
  } else if (q.statut === "termine") {
    actions = `<div class="qa-actions"><button class="ok act" type="button" data-act="re" data-id="${esc(q.id)}">Réactiver</button><button class="sec" type="button" data-act="rank" data-id="${esc(q.id)}">Classement</button><button class="del" type="button" data-act="del" data-id="${esc(q.id)}">Supprimer</button></div>`;
  } else if (q.statut === "en_cours") {
    actions = `<div class="qa-actions"><button class="sec act" type="button" data-act="rank" data-id="${esc(q.id)}">Classement</button></div>`;
  }
  return `<article class="qa">
    <div class="qa-top"><div class="qa-title">${esc(q.titre || "(sans titre)")}</div><span class="badge ${esc(q.statut)}">${esc(LABEL[q.statut] || q.statut || "?")}</span></div>
    <div class="qa-meta">${q.nbQuestions || "?"} questions · ${q.temps || 20} s par question</div>
    <div class="qa-who"><b>${esc(q.ownerName || "—")}</b><span>${esc(q.ownerEmail || "")}</span></div>
    <div class="qa-meta">${esc(fmt(q.createdAt))} · ID <code>${esc(q.id.slice(0, 8))}</code></div>
    ${pin}${actions}
  </article>`;
}

function draw() {
  const list = [...ALL].sort((a, b) =>
    (RANK[a.statut] ?? 3) - (RANK[b.statut] ?? 3) || (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  const payes = list.filter((q) => q.statut !== "brouillon");
  $("#stats").innerHTML = [
    ["Quiz créés", list.length],
    ["En attente de paiement", list.length - payes.length],
    ["Quiz activés", payes.length],
    ["Revenus estimés", (payes.length * PRIX).toLocaleString("fr-FR") + " F"],
  ].map(([k, v]) => `<div class="stat"><span class="muted">${k}</span><b>${v}</b></div>`).join("");
  $("#list").innerHTML = list.map(card).join("") || `<p class="muted empty">Aucun quiz pour l'instant.</p>`;
}

$("#list").addEventListener("click", async (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b || b.disabled) return;
  const q = ALL.find((x) => x.id === b.dataset.id);
  if (!q) return;
  const label = b.textContent;
  try {
    if (b.dataset.act === "on") {
      if (!confirm(`Paiement de ${PRIX} F reçu pour « ${q.titre || "ce quiz"} » ? Le quiz sera activé.`)) return;
      b.disabled = true; b.textContent = "Activation…";
      await activer(q.id);
    } else if (b.dataset.act === "re") {
      if (!confirm(`Réactiver « ${q.titre || "ce quiz"} » ?\n\nLe quiz repasse en salle d'attente (même PIN si libre). Le classement et les joueurs de la partie précédente sont effacés. Regarde-les d'abord avec « Classement » si besoin.`)) return;
      b.disabled = true; b.textContent = "Réactivation…";
      await reactiver(q);
    } else if (b.dataset.act === "rank") {
      b.disabled = true; b.textContent = "Chargement…";
      await classement(q);
    } else if (b.dataset.act === "del") {
      if (!confirm(`Supprimer définitivement « ${q.titre || "ce quiz"} » ?`)) return;
      b.disabled = true; b.textContent = "Suppression…";
      await supprimer(q.id);
    }
  } catch (er) { console.error(er); alert(er.message); }
  b.disabled = false; b.textContent = label;
});

async function activer(id) {
  let pin;
  for (let n = 0; n < 10; n++) {
    pin = String(Math.floor(100000 + Math.random() * 900000));
    const dup = await getDocs(query(collection(db, "quizzes"), where("pin", "==", pin), where("statut", "in", ["actif", "en_cours"])));
    if (dup.empty) break;
  }
  await updateDoc(doc(db, "quizzes", id), { statut: "actif", pin, phase: "lobby", qIndex: -1, activatedAt: serverTimestamp() });
}

// Efface tous les documents d'une sous-collection du quiz
async function vider(id, sub) {
  const docs = (await getDocs(collection(db, "quizzes", id, sub))).docs;
  for (let i = 0; i < docs.length; i += 400) {
    const batch = writeBatch(db);
    docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
}

// Remet un quiz terminé en salle d'attente, prêt à être relancé par son créateur (« Lancer la partie »)
async function reactiver(q) {
  await vider(q.id, "players"); await vider(q.id, "pseudos");
  let pin = q.pin;
  for (let n = 0; n < 10; n++) {
    if (pin) {
      const dup = await getDocs(query(collection(db, "quizzes"), where("pin", "==", pin), where("statut", "in", ["actif", "en_cours"])));
      if (dup.empty) break;
    }
    pin = String(Math.floor(100000 + Math.random() * 900000));
  }
  await updateDoc(doc(db, "quizzes", q.id), {
    statut: "actif", pin, phase: "lobby", qIndex: -1,
    results: deleteField(), resultsQ: deleteField(), correct: deleteField(), qStart: deleteField(), full: deleteField(),
    activatedAt: serverTimestamp(),
  });
}

// Classement d'une partie : les points sont dans la fiche du quiz, les pseudos dans les joueurs (une lecture par joueur, à la demande)
async function classement(q) {
  const players = (await getDocs(collection(db, "quizzes", q.id, "players"))).docs.map((d) => ({ id: d.id, pseudo: d.data().pseudo }));
  const res = q.results || {};
  const rows = players.map((p) => ({ pseudo: p.pseudo || "?", score: res[p.id]?.score || 0 })).sort((a, b) => b.score - a.score);
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box"><div class="qa-top"><div class="qa-title">Classement · ${esc(q.titre || "")}</div><button class="sec" type="button" style="min-height:40px">Fermer</button></div>
    <div class="qa-meta" style="margin:6px 0 10px">${rows.length} joueur${rows.length > 1 ? "s" : ""}${q.statut === "en_cours" ? " · partie en cours" : ""}</div>
    ${rows.length ? rows.map((r, i) => `<div class="rk"><span class="n">${i + 1}</span><span class="p">${esc(r.pseudo)}</span><span class="s">${r.score.toLocaleString("fr-FR")} pts</span></div>`).join("") : `<p class="muted">Aucun joueur enregistré pour cette partie.</p>`}</div>`;
  const close = () => ov.remove();
  ov.addEventListener("click", (e) => { if (e.target === ov || e.target.closest("button")) close(); });
  document.body.appendChild(ov);
}

// Supprime le quiz et ses sous-collections (sinon elles restent orphelines dans Firestore)
async function supprimer(id) {
  for (const sub of ["questions", "players", "pseudos", "public", "private"]) {
    const docs = (await getDocs(collection(db, "quizzes", id, sub))).docs;
    for (let i = 0; i < docs.length; i += 400) {
      const batch = writeBatch(db);
      docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
      await batch.commit();
    }
  }
  await deleteDoc(doc(db, "quizzes", id));
}
</script>
</body>
</html>
